name: Checks
# Keep checks available for an explicitly authorized manual run.
# Publication must not start CI automatically.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot: ["4.25.0", "4.29.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK and test tools
        run: |
          python -m pip install uv
          uv pip install --system "astrbot==${{ matrix.astrbot }}" pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
